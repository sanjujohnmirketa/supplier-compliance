<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#1D4ED8"/>
    </marker>
  </defs>

  <rect width="1400" height="900" fill="#F8FAFC"/>
  <text x="30" y="36" font-size="20" font-weight="700" fill="#0F172A">Current System Interaction — Supplier Compliance Platform</text>
  <text x="30" y="58" font-size="12" fill="#64748B">Salesforce (LWC + Apex) &#8596; FastAPI Compliance Engine &#8596; RAG (pgvector) + LLM + External Registries</text>

  <!-- ZONE 1: Salesforce -->
  <rect x="30" y="90" width="560" height="740" rx="10" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5"/>
  <text x="50" y="118" font-size="14" font-weight="700" fill="#1D4ED8">SALESFORCE — Experience Cloud + Internal App</text>

  <!-- scComplianceConsole shell -->
  <rect x="50" y="135" width="520" height="220" rx="8" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="65" y="155" font-size="12.5" font-weight="700" fill="#1E293B">scComplianceConsole (parent shell)</text>

  <rect x="65" y="168" width="150" height="70" rx="6" fill="#DBEAFE" stroke="#60A5FA"/>
  <text x="140" y="196" font-size="11.5" font-weight="700" fill="#1D4ED8" text-anchor="middle">scProcurementConsole</text>
  <text x="140" y="212" font-size="9.5" fill="#475569" text-anchor="middle">checklist · upload · screen</text>

  <rect x="225" y="168" width="150" height="70" rx="6" fill="#DBEAFE" stroke="#60A5FA"/>
  <text x="300" y="196" font-size="11.5" font-weight="700" fill="#1D4ED8" text-anchor="middle">scAnalystConsole</text>
  <text x="300" y="212" font-size="9.5" fill="#475569" text-anchor="middle">validate · decide · route</text>

  <rect x="385" y="168" width="170" height="70" rx="6" fill="#DBEAFE" stroke="#60A5FA"/>
  <text x="470" y="196" font-size="11.5" font-weight="700" fill="#1D4ED8" text-anchor="middle">scSupplierPortal</text>
  <text x="470" y="212" font-size="9.5" fill="#475569" text-anchor="middle">public intake · invite sub-supplier</text>

  <text x="300" y="258" font-size="10" fill="#64748B" text-anchor="middle">all consoles call @AuraEnabled methods</text>
  <line x1="140" y1="238" x2="300" y2="280" stroke="#94A3B8" stroke-width="1.3"/>
  <line x1="300" y1="238" x2="300" y2="280" stroke="#94A3B8" stroke-width="1.3"/>
  <line x1="470" y1="238" x2="300" y2="280" stroke="#94A3B8" stroke-width="1.3"/>

  <!-- VendorPortalController -->
  <rect x="90" y="280" width="440" height="55" rx="6" fill="#1D4ED8"/>
  <text x="310" y="304" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">VendorPortalController (Apex)</text>
  <text x="310" y="320" font-size="9.5" fill="#DBEAFE" text-anchor="middle">generateChecklist · startAgentCase · runScreening · askCopilot · saveDecision</text>

  <!-- Data model box -->
  <rect x="50" y="375" width="520" height="175" rx="8" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="65" y="396" font-size="12.5" font-weight="700" fill="#1E293B">Salesforce Data Model</text>

  <rect x="65" y="408" width="150" height="52" rx="5" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="140" y="428" font-size="10.5" font-weight="700" text-anchor="middle" fill="#334155">Account</text>
  <text x="140" y="442" font-size="8.7" fill="#64748B" text-anchor="middle">Supplier · ParentId</text>
  <text x="140" y="453" font-size="8.7" fill="#64748B" text-anchor="middle">tier cascade</text>

  <rect x="225" y="408" width="180" height="52" rx="5" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="315" y="428" font-size="10.5" font-weight="700" text-anchor="middle" fill="#334155">Compliance_Assessment__c</text>
  <text x="315" y="442" font-size="8.7" fill="#64748B" text-anchor="middle">1 per required doc</text>
  <text x="315" y="453" font-size="8.7" fill="#64748B" text-anchor="middle">verdict + grounded reason</text>

  <rect x="415" y="408" width="140" height="52" rx="5" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="485" y="428" font-size="10.5" font-weight="700" text-anchor="middle" fill="#334155">Compliance_Document__c</text>
  <text x="485" y="442" font-size="8.7" fill="#64748B" text-anchor="middle">uploaded file</text>
  <text x="485" y="453" font-size="8.7" fill="#64748B" text-anchor="middle">+ extraction</text>

  <rect x="65" y="472" width="490" height="45" rx="5" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="310" y="491" font-size="10.5" font-weight="700" text-anchor="middle" fill="#334155">Audit_Log__c — append-only activity/decision trail (polymorphic)</text>
  <text x="310" y="505" font-size="8.7" fill="#64748B" text-anchor="middle">Event_Type · Actor_Type · New_Value · Related_Record_Id</text>

  <!-- Named Credential -->
  <rect x="90" y="565" width="440" height="60" rx="6" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="310" y="590" font-size="12.5" font-weight="700" fill="#92400E" text-anchor="middle">Named Credential — Local_Compliance_Service</text>
  <text x="310" y="606" font-size="9.5" fill="#92400E" text-anchor="middle">TRUST BOUNDARY · Bearer token · today: VS Code dev tunnel</text>

  <!-- outbound arrow from controller down to NC -->
  <line x1="310" y1="335" x2="310" y2="375" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="310" y1="550" x2="310" y2="565" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/>

  <text x="50" y="655" font-size="11" fill="#334155" font-style="italic">Salesforce is the SYSTEM OF RECORD: intake, checklist display,</text>
  <text x="50" y="671" font-size="11" fill="#334155" font-style="italic">document storage, human decisions, audit trail.</text>

  <!-- ZONE 2: Engine -->
  <rect x="640" y="90" width="380" height="500" rx="10" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.5"/>
  <text x="660" y="118" font-size="14" font-weight="700" fill="#166534">COMPLIANCE ENGINE — FastAPI (Python)</text>

  <rect x="660" y="135" width="340" height="145" rx="8" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1.2"/>
  <text x="675" y="155" font-size="11.5" font-weight="700" fill="#1E293B">HTTP endpoints</text>
  <rect x="675" y="164" width="150" height="26" rx="4" fill="#DCFCE7"/>
  <text x="750" y="181" font-size="10" text-anchor="middle" fill="#166534" font-family="monospace">/scope</text>
  <rect x="835" y="164" width="150" height="26" rx="4" fill="#DCFCE7"/>
  <text x="910" y="181" font-size="10" text-anchor="middle" fill="#166534" font-family="monospace">/assess</text>
  <rect x="675" y="196" width="150" height="26" rx="4" fill="#DCFCE7"/>
  <text x="750" y="213" font-size="10" text-anchor="middle" fill="#166534" font-family="monospace">/verify</text>
  <rect x="835" y="196" width="150" height="26" rx="4" fill="#DCFCE7"/>
  <text x="910" y="213" font-size="10" text-anchor="middle" fill="#166534" font-family="monospace">/copilot</text>
  <rect x="675" y="228" width="310" height="26" rx="4" fill="#BBF7D0"/>
  <text x="830" y="245" font-size="10" text-anchor="middle" fill="#166534" font-family="monospace">/cases  /cases/{id}  /cases/{id}/resume</text>

  <!-- LangGraph agent -->
  <rect x="660" y="295" width="340" height="270" rx="8" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1.2"/>
  <text x="675" y="317" font-size="11.5" font-weight="700" fill="#1E293B">LangGraph Agent Supervisor (durable, Postgres-checkpointed)</text>

  <g font-size="9.5" fill="#166534" text-anchor="middle">
    <rect x="675" y="330" width="95" height="34" rx="5" fill="#ECFDF5" stroke="#6EE7B7"/>
    <text x="722" y="351">intake / scope</text>
    <rect x="785" y="330" width="95" height="34" rx="5" fill="#ECFDF5" stroke="#6EE7B7"/>
    <text x="832" y="351">screening</text>
    <rect x="895" y="330" width="95" height="34" rx="5" fill="#ECFDF5" stroke="#6EE7B7"/>
    <text x="942" y="351">documents</text>
  </g>
  <path d="M770,347 L785,347" stroke="#22C55E" stroke-width="1.3" marker-end="url(#arrow)"/>
  <path d="M880,347 L895,347" stroke="#22C55E" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- GATE 1 -->
  <rect x="675" y="374" width="315" height="24" rx="4" fill="#FEF3C7" stroke="#F59E0B" stroke-dasharray="3,2"/>
  <text x="832" y="390" font-size="9.5" fill="#92400E" text-anchor="middle" font-weight="700">GATE 1 — procurement confirms scope</text>

  <g font-size="9.5" fill="#166534" text-anchor="middle">
    <rect x="675" y="408" width="95" height="34" rx="5" fill="#ECFDF5" stroke="#6EE7B7"/>
    <text x="722" y="429">risk</text>
    <rect x="785" y="408" width="95" height="34" rx="5" fill="#ECFDF5" stroke="#6EE7B7"/>
    <text x="832" y="429">synthesis</text>
    <rect x="895" y="408" width="95" height="34" rx="5" fill="#ECFDF5" stroke="#6EE7B7"/>
    <text x="942" y="429">routing</text>
  </g>
  <path d="M770,425 L785,425" stroke="#22C55E" stroke-width="1.3" marker-end="url(#arrow)"/>
  <path d="M880,425 L895,425" stroke="#22C55E" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- GATE 2 -->
  <rect x="675" y="452" width="315" height="24" rx="4" fill="#FEF3C7" stroke="#F59E0B" stroke-dasharray="3,2"/>
  <text x="832" y="468" font-size="9.5" fill="#92400E" text-anchor="middle" font-weight="700">GATE 2 — analyst signs off (decision)</text>

  <rect x="757" y="486" width="150" height="30" rx="5" fill="#DCFCE7" stroke="#22C55E"/>
  <text x="832" y="506" font-size="10" fill="#166534" text-anchor="middle" font-weight="700">decision (finalize)</text>

  <text x="675" y="536" font-size="9" fill="#475569" font-style="italic">Safety rule: a flagged case can NEVER auto-clear.</text>
  <text x="675" y="550" font-size="9" fill="#475569" font-style="italic">Determinism: risk/checklist = rules; LLM narrates, math decides.</text>

  <!-- ZONE 3: Data & AI -->
  <rect x="640" y="610" width="380" height="220" rx="10" fill="#FAF5FF" stroke="#E9D5FF" stroke-width="1.5"/>
  <text x="660" y="638" font-size="14" font-weight="700" fill="#7C3AED">DATA &amp; AI</text>

  <rect x="660" y="655" width="340" height="80" rx="8" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="1.2"/>
  <text x="830" y="677" font-size="11.5" font-weight="700" fill="#1E293B" text-anchor="middle">Postgres + pgvector — policy_chunk</text>
  <text x="830" y="694" font-size="9.5" fill="#64748B" text-anchor="middle">source · version · clause_id · domain · text</text>
  <text x="830" y="709" font-size="9.5" fill="#64748B" text-anchor="middle">embedding(384) — all-MiniLM-L6-v2, local, no API key</text>
  <text x="830" y="724" font-size="9" fill="#7C3AED" text-anchor="middle">hybrid: dense cosine + sparse BM25 + RRF fusion</text>

  <rect x="660" y="750" width="340" height="65" rx="8" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="1.2"/>
  <text x="830" y="774" font-size="11.5" font-weight="700" fill="#1E293B" text-anchor="middle">LLM Provider (provider-agnostic)</text>
  <text x="830" y="792" font-size="9.5" fill="#64748B" text-anchor="middle">OpenAI / Azure / Anthropic / Ollama (on-prem)</text>
  <text x="830" y="806" font-size="9" fill="#7C3AED" text-anchor="middle">structured-JSON output only; narrates, never decides</text>

  <!-- ZONE 4: External Registries -->
  <rect x="1050" y="90" width="320" height="500" rx="10" fill="#FFF7ED" stroke="#FED7AA" stroke-width="1.5"/>
  <text x="1070" y="118" font-size="14" font-weight="700" fill="#C2410C">EXTERNAL REGISTRIES</text>

  <rect x="1070" y="140" width="280" height="55" rx="6" fill="#FFFFFF" stroke="#FDBA74"/>
  <text x="1210" y="163" font-size="11" font-weight="700" fill="#1E293B" text-anchor="middle">GLEIF</text>
  <text x="1210" y="180" font-size="9" fill="#64748B" text-anchor="middle">legal entity identity lookup</text>

  <rect x="1070" y="205" width="280" height="55" rx="6" fill="#FFFFFF" stroke="#FDBA74"/>
  <text x="1210" y="228" font-size="11" font-weight="700" fill="#1E293B" text-anchor="middle">sanctions.network (free) / OpenSanctions</text>
  <text x="1210" y="245" font-size="9" fill="#64748B" text-anchor="middle">sanctions / watchlist screening</text>

  <rect x="1070" y="270" width="280" height="55" rx="6" fill="#FFFFFF" stroke="#FDBA74"/>
  <text x="1210" y="293" font-size="11" font-weight="700" fill="#1E293B" text-anchor="middle">GDELT</text>
  <text x="1210" y="310" font-size="9" fill="#64748B" text-anchor="middle">adverse media scan</text>

  <text x="1070" y="350" font-size="9.5" fill="#9A3412" font-style="italic">Called only from /verify.</text>
  <text x="1070" y="365" font-size="9.5" fill="#9A3412" font-style="italic">A provider error routes to analyst —</text>
  <text x="1070" y="380" font-size="9.5" fill="#9A3412" font-style="italic">never silently reads as "Compliant".</text>

  <!-- ARROWS between zones -->
  <path d="M530,595 L640,220" fill="none" stroke="#1D4ED8" stroke-width="1.6" marker-end="url(#arrowBlue)"/>
  <text x="545" y="440" font-size="9.5" fill="#1D4ED8" transform="rotate(-52 545,440)">HTTPS + Bearer</text>

  <path d="M660,240 L560,610" fill="none" stroke="#1D4ED8" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#arrowBlue)"/>
  <text x="580" y="480" font-size="9.5" fill="#1D4ED8" transform="rotate(58 580,480)">verdict write-back</text>

  <path d="M830,250 L830,610" stroke="#7C3AED" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="845" y="440" font-size="9.5" fill="#7C3AED">retrieval + generation</text>

  <path d="M1000,200 L1070,200" stroke="#C2410C" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1005" y="215" font-size="9" fill="#C2410C">/verify calls</text>

  <!-- Legend -->
  <rect x="30" y="850" width="1340" height="40" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
  <circle cx="55" cy="870" r="6" fill="#DBEAFE" stroke="#60A5FA"/><text x="70" y="874" font-size="10" fill="#334155">Salesforce component</text>
  <circle cx="230" cy="870" r="6" fill="#DCFCE7" stroke="#22C55E"/><text x="245" y="874" font-size="10" fill="#334155">Engine endpoint / agent stage</text>
  <circle cx="460" cy="870" r="6" fill="#E9D5FF" stroke="#A855F7"/><text x="475" y="874" font-size="10" fill="#334155">Data / AI</text>
  <rect x="640" y="864" width="14" height="10" fill="#FEF3C7" stroke="#F59E0B"/><text x="660" y="874" font-size="10" fill="#334155">Trust boundary / human gate</text>
  <line x1="880" y1="870" x2="910" y2="870" stroke="#1D4ED8" stroke-width="2"/><text x="918" y="874" font-size="10" fill="#334155">Salesforce &#8596; Engine</text>
  <line x1="1080" y1="870" x2="1110" y2="870" stroke="#7C3AED" stroke-width="2"/><text x="1118" y="874" font-size="10" fill="#334155">Engine &#8596; RAG/LLM</text>
</svg>
