# ════════════════════════════════════════════════════════════════════════════
# Run the whole engine in containers:
#     docker compose up --build
# Ingest the policy corpus once (first run):
#     docker compose exec engine python ingest_policies.py
#
# Provider keys come from your .env (nothing bundled). For a fully on-prem /
# air-gapped deployment set LLM_PROVIDER=ollama + a local model — no key needed.
# ════════════════════════════════════════════════════════════════════════════
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: compliance-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: compliance
      POSTGRES_DB: compliance
      POSTGRES_PASSWORD: 'JohnCompliance123'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compliance -d compliance"]
      interval: 5s
      timeout: 3s
      retries: 12

  # The compliance engine (FastAPI). Containerizing this is what retires the
  # VS Code tunnel and makes the service deployable on-prem / scalable.
  engine:
    build: .
    container_name: compliance-engine
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      # DB points at the compose service (overrides any .env DB_URL)
      DB_URL: postgresql://compliance:JohnCompliance123@db:5432/compliance
      INBOUND_TOKEN:         ${INBOUND_TOKEN:-change-me-shared-bearer-token}
      EMBED_BACKEND:         ${EMBED_BACKEND:-local}
      LLM_PROVIDER:          ${LLM_PROVIDER:-openai}
      LLM_MODEL:             ${LLM_MODEL:-gpt-4o-mini}
      LLM_TEMPERATURE:       ${LLM_TEMPERATURE:-0}
      LLM_TIMEOUT:           ${LLM_TIMEOUT:-60}
      OPENAI_API_KEY:        ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL:       ${OPENAI_BASE_URL:-}
      ANTHROPIC_API_KEY:     ${ANTHROPIC_API_KEY:-}
      # Fast-path override (chat_json(fast=True)) — can point at a different
      # provider than the main LLM_PROVIDER above (e.g. trialing a model that
      # only exists on Azure while the main reasoning path stays elsewhere).
      LLM_PROVIDER_FAST:     ${LLM_PROVIDER_FAST:-}
      LLM_MODEL_FAST:        ${LLM_MODEL_FAST:-}
      AZURE_ENDPOINT:        ${AZURE_ENDPOINT:-}
      AZURE_API_KEY:         ${AZURE_API_KEY:-}
      AZURE_API_VERSION:     ${AZURE_API_VERSION:-2024-10-21}
      OLLAMA_BASE_URL:       ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      LOCAL_BASE_URL:        ${LOCAL_BASE_URL:-}
      OPENSANCTIONS_API_KEY: ${OPENSANCTIONS_API_KEY:-}
      # Free Trade.gov Consolidated Screening List key (api.data.gov). Empty →
      # sanctions registry validation degrades to manual. Nothing bundled.
      CSL_API_KEY:           ${CSL_API_KEY:-}

  # Local SFTP server for the policy corpus.
  # Drop files into ./policies on your machine; they appear at /upload inside SFTP.
  # Login: user=compliance  pass=SftpPass123  port=2222
  sftp:
    image: atmoz/sftp:alpine
    container_name: compliance-sftp
    ports:
      - "2222:22"
    volumes:
      - ./policies:/home/compliance/upload
    command: compliance:SftpPass123:1001

volumes:
  pgdata:
